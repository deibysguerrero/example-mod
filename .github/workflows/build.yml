name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android
            os: ubuntu-latest

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Initialize Compilation Environment
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.name == 'Android' && 'Android' || '' }}
          build-config: Release

      - name: Verify Output Files
        shell: bash
        run: |
          ls -R
          mkdir -p final_out
          cp *.geode final_out/ 2>/dev/null || true

      - name: Upload Mod Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.name }}-Package
          path: final_out/
          if-no-files-found: error
          
